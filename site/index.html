<html lang="la" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">

<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="./" aria-label="Cantus Horarum"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="5"/><path d="M16 5c1.6 3 2 5.5 1.5 8.5 3-.5 5.5-.1 8.5 1.5-3 1.6-5.5 2-8.5 1.5.5 3 .1 5.5-1.5 8.5-1.6-3-2-5.5-1.5-8.5-3 .5-5.5.1-8.5-1.5 3-1.6 5.5-2 8.5-1.5C14 10.5 14.4 8 16 5z"/></svg></a>
    <select id="hour" aria-label="Hora">
      <option value="lectio">Officium lectionis</option>
      <option value="laudes">Laudes</option>
      <option value="tertia">Tertia</option>
      <option value="sexta">Sexta</option>
      <option value="nona">Nona</option>
      <option value="vesperae">Vesperæ</option>
      <option value="completorium">Completorium</option>
    </select>
    <input type="date" id="date" aria-label="Dies">
    <button class="gear" id="settings-toggle" aria-label="Optiones" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </div>
  <div id="settings" class="settings" hidden>
    <p class="settings-title">Psalmorum modus</p>
    <div class="modes" role="radiogroup" aria-label="Psalmorum modus">
      <button class="mode" data-psalms="text" role="radio">
        <span class="preview mini" aria-hidden="true"></span>
        <span class="mode-name">Compactus</span>
      </button>
      <button class="mode" data-psalms="" role="radio">
        <span class="preview mini" aria-hidden="true"></span>
        <span class="mode-name">Plenus</span>
      </button>
    </div>
    <label class="row">Invitatorium ante <select id="opt-invitatory"><option value="">—</option><option value="lectio">Officium lectionis</option><option value="laudes">Laudes</option></select></label>
    <label class="row">In memoriis, a lectione brevi <select id="opt-memoria"><option value="">de feria</option><option value="commune">de communi</option></select></label>
    <label class="row">Translatio <select id="opt-translation"><option value="">—</option><option value="en">English</option><option value="zh">中文 (香港)</option></select></label>
    <label class="row">Lectio brevis et oratio <select id="opt-recite"><option value="">cum cantu</option><option value="text">sine cantu</option></select></label>
    <label class="row">Præest sacerdos vel diaconus <select id="opt-presider"><option value="">Non</option><option value="1">Ita</option></select></label>
    <label class="row">Vox ad canendum <select id="opt-voice"><option value="gravis">gravis</option><option value="">media</option><option value="acuta">acuta</option></select></label>
    <label class="row">Nox <select id="opt-theme"><option value="">ut systema</option><option value="light">Non</option><option value="dark">Ita</option></select></label>
    <div class="row">PDF <span class="pdf"><select id="pdf-format" aria-label="Forma"><option value="a4">A4</option><option value="a5">A5</option><option value="letter">Letter</option><option value="booklet-a4">Libellus A4</option><option value="booklet-letter">Libellus Letter</option></select><button id="pdf-make" type="button">Fac</button></span></div>
    <label class="row">Litterae <input type="range" id="text-size" min="85" max="140" step="5" value="100"></label>
  </div>
</header>

<main id="office" class="office">
  <p class="loading">Paratur…</p>
