<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cantus Horarum</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="./" aria-label="Cantus Horarum"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="5"/><path d="M16 5c1.6 3 2 5.5 1.5 8.5 3-.5 5.5-.1 8.5 1.5-3 1.6-5.5 2-8.5 1.5.5 3 .1 5.5-1.5 8.5-1.6-3-2-5.5-1.5-8.5-3 .5-5.5.1-8.5-1.5 3-1.6 5.5-2 8.5-1.5C14 10.5 14.4 8 16 5z"/></svg></a>
    <select id="hour" aria-label="Hour">
      <option value="lectio">Office of Readings</option>
      <option value="laudes">Lauds</option>
      <option value="tertia">Terce</option>
      <option value="sexta">Sext</option>
      <option value="nona">None</option>
      <option value="vesperae">Vespers</option>
      <option value="completorium">Compline</option>
    </select>
    <input type="date" id="date" aria-label="Date">
    <button class="gear" id="settings-toggle" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </div>
  <div id="settings" class="settings" hidden>
    <p class="settings-title">Psalm display mode</p>
    <div class="modes" role="radiogroup" aria-label="Psalm display mode">
      <button class="mode" data-psalms="text" role="radio">
        <span class="preview mini" aria-hidden="true"></span>
        <span class="mode-name">Compact</span>
      </button>
      <button class="mode" data-psalms="" role="radio">
        <span class="preview mini" aria-hidden="true"></span>
        <span class="mode-name">Detailed</span>
      </button>
    </div>
    <label class="row">Invitatory before <select id="opt-invitatory"><option value="">—</option><option value="lectio">Office of Readings</option><option value="laudes">Lauds</option></select></label>
    <label class="row">Memorials, from the short reading <select id="opt-memoria"><option value="">of the weekday</option><option value="commune">of the common</option></select></label>
    <label class="row">Priest or deacon present <select id="opt-presider"><option value="">No</option><option value="1">Yes</option></select></label>
    <label class="row">Singing voice <select id="opt-voice"><option value="gravis">Low</option><option value="">Medium</option><option value="acuta">High</option></select></label>
    <label class="row">Dark mode <select id="opt-theme"><option value="">System</option><option value="light">Off</option><option value="dark">On</option></select></label>
    <div class="row">PDF <span class="pdf"><select id="pdf-format" aria-label="Page format"><option value="a4">A4</option><option value="a5">A5</option><option value="letter">Letter</option><option value="booklet-a4">Booklet A4</option><option value="booklet-letter">Booklet Letter</option></select><button id="pdf-make" type="button">Make</button></span></div>
    <label class="row">Text size <input type="range" id="text-size" min="85" max="140" step="5" value="100"></label>
  </div>
</header>

<main id="office" class="office" lang="la">
  <p class="loading">Loading…</p>
</main>
<footer class="colophon">
  <p>For private use only.</p>
  <p><a href="mailto:fr.joe@missionsetrangeres.com">fr.joe@missionsetrangeres.com</a></p>
</footer>

<script src="vendor/exsurge.min.js"></script>
<script src="vendor/jgabc/shim.js"></script>
<script src="vendor/jgabc/jquery.hypher.js"></script>
<script src="vendor/jgabc/la-hypher.js"></script>
<script src="vendor/jgabc/util.js"></script>
<script src="vendor/jgabc/psalmtone.js"></script>
<script src="vendor/jgabc/after.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
