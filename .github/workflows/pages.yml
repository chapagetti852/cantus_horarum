name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # daily, 03:00 in Hong Kong: refresh the window of daily texts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # iBreviary pages are cached between runs, so only new dates are fetched
      - uses: actions/cache@v4
        with:
          path: |
            cache/ibreviary
            cache/texts
          key: ibreviary-${{ github.run_id }}
          restore-keys: ibreviary-
      - name: Fetch the window of daily texts
        run: node scripts/texts/window.mjs 3 35
        continue-on-error: true
      - name: Build site
        run: node scripts/build.mjs
      - run: npm test --if-present # after the build: the tone and propers tests read dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
